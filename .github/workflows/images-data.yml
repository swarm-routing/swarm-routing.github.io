name: Images data
# data/images.json, the /images/ page's data, regenerated daily from the
# registry by tools/images_data.py and proposed in the bot/images-data PR
# (auto-merge; the full Pages gate decides it). Daily, not with
# release-sync.yml's weekly and on-release pass: ns3-dev's rolling tags move
# on every push to sim-containers' main and on its daily OS refresh, so a
# weekly pass would leave the page up to a week behind the registry; a daily
# run keeps it within a day and also catches every release image (they are
# published by their release, which this run sees the next day at the
# latest). No secret is needed to read: the packages are public and the
# script uses ghcr.io's anonymous pull token. The PR needs the bot's token, so
# its checks run. When the registry says nothing new, no PR is opened.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh data/images.json
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        timeout-minutes: 3
        with:
          python-version: '3.x'
      - name: The bot's token
        id: bot
        uses: swarm-routing/.github/.github/actions/bot-token@12daa5bc816975ca6a4d4daf1c16b7f692190c4e # main@2026-11-26
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}
      - name: Git identity
        env:
          NAME: ${{ steps.bot.outputs.git-name }}
          EMAIL: ${{ steps.bot.outputs.git-email }}
        run: |
          git config user.name "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898283+github-actions[bot]@users.noreply.github.com}"
      - name: data/images.json (bot/images-data PR)
        timeout-minutes: 8  # a run reads about 300 registry documents (80 s locally)
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          python3 tools/images_data.py   # a failed request writes nothing and fails the step
          cat > "$RUNNER_TEMP/images.md" <<EOF
          \`data/images.json\` regenerated by \`tools/images_data.py\` from the ghcr.io registry (tags, digests, image labels; anonymous pulls), by [images data](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Never edited by hand; the /images/ page renders it.
          EOF
          tools/bot_pr.sh bot/images-data "chore(images): refresh data/images.json from the registry" "$RUNNER_TEMP/images.md" data/images.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
