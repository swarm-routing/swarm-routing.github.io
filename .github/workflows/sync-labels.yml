name: Sync labels

# Applies the org label taxonomy (swarm-routing/.github labels.json, from
# AntHocNet ADR-0013) to this repo: creates missing labels and updates colour
# and description of existing ones; never deletes. Runs on the PR that adds or
# changes this file, monthly, and on demand.
on:
  pull_request:
    paths: ['.github/workflows/sync-labels.yml']
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  labels:
    permissions:
      contents: read
      issues: write
    uses: swarm-routing/.github/.github/workflows/sync-labels.yml@main
