name: Pages

# The org site (ADR-0001): the Colony Arena hub at /, a space per project at
# /projects/<id>/ (the old /arena/<id>/ redirects), /references/, and AntHocNet's game, docs and API at /AntHocNet/{,docs/,api/}.
# AntHocNet is built from swarm-routing/AntHocNet at the commit in
# protocols.lock, with this repository's site/anthocnet/ laid over it as its
# web/ (tools/build-site.sh); nothing of AntHocNet's is vendored here.
#
# Every PR runs the full gate (parity, AntHocNet's web tests, both crawls,
# both browser smokes with axe), except a docs-only one: when it changes only
# this repository's top-level prose, docs/, .claude/ or metadata no build
# reads, the job reports with its steps skipped (swarm-routing/.github#581;
# site/anthocnet/**/*.md always builds). Only main deploys. A lock bump is a PR, so it
# runs the same gate before the new commit ships.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)
  workflow_dispatch:

permissions:
  contents: read

# One live deployment at a time; an in-flight publish always finishes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, parity, crawl, smoke + axe
    runs-on: ubuntu-24.04   # Playwright's Chromium is not supported on ubuntu-26.04 (AntHocNet #847)
    timeout-minutes: 60
    outputs:
      core: ${{ steps.core.outputs.v }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      # a docs-only change skips the steps below; the check still reports (swarm-routing/.github#581)
      - uses: swarm-routing/.github/.github/actions/changes@6cca00a3550b6d2a3232bb22d02d5419ff94eefa # main@2026-11-27
        id: changes
        timeout-minutes: 2
        with:
          paths: '^[^/]+\.md$|^docs/|^\.claude/|^\.github/ISSUE_TEMPLATE/|^\.github/(CODEOWNERS|FUNDING\.yml|pull_request_template\.md)$|^LICENSE[^/]*$|^CITATION\.cff$|^\.coderabbit\.yaml$|^\.bestpractices\.json$|^\.github/org-sync\.lock$'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.docs-only != 'true'
        with:
          python-version: '3.x'
      # a shellcheck finding fails this required check, so it is fixed before
      # the change merges (swarm-routing/.github#635); `make lint` runs the same
      - name: shellcheck (every tracked shell script)
        if: steps.changes.outputs.docs-only != 'true'
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck "${scripts[@]}"
      - name: Self-tests (lock reader, hub crawler, references section, the one top bar) and the one token file
        if: steps.changes.outputs.docs-only != 'true'
        run: |
          python3 tools/lock.py --self-test
          python3 tools/check_hub.py --self-test
          python3 tools/stamp_build.py --self-test
          python3 tools/hub_data.py --self-test
          python3 tools/images_data.py --self-test
          python3 tools/release_sync.py --self-test
          bash -n tools/bot_pr.sh
          python3 tools/render_hub.py --self-test
          python3 site/anthocnet/shell/inject.py --self-test
          node test/shell-search.test.mjs   # the search decodes in script, never through the DOM (#247)
          python3 tools/check_tokens.py --self-test
          python3 tools/check_tokens.py   # no colour, radius or font outside shell/tokens.css (#97)
      - name: Read the AntHocNet pin
        if: steps.changes.outputs.docs-only != 'true'
        id: pin
        timeout-minutes: 2  # two API reads
        env:
          GH_TOKEN: ${{ github.token }}
        # Only a commit on the protocol repository's default branch is built:
        # protocols.lock is reviewed, and this proves it in the run too, so the
        # checkout below never takes a ref a branch or a fork could move
        # (code scanning's cache-poisoning finding, #248 to #254).
        run: |
          repo=$(python3 tools/lock.py AntHocNet repo)
          commit=$(python3 tools/lock.py AntHocNet commit)
          case "$commit" in
            *[!0-9a-f]*|'') echo "::error::protocols.lock: AntHocNet commit '$commit' is not a hex SHA"; exit 1 ;;
          esac
          [ "${#commit}" -eq 40 ] || { echo "::error::protocols.lock: AntHocNet commit is not 40 characters"; exit 1; }
          default=$(gh api "repos/$repo" --jq .default_branch)
          status=$(gh api "repos/$repo/compare/$default...$commit" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "::error::protocols.lock pins $commit, which is not on $repo's $default ($status)"; exit 1 ;;
          esac
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Check out AntHocNet at the pinned commit
        if: steps.changes.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: build/src/AntHocNet
          persist-credentials: false
      - name: Install emsdk (AntHocNet's pin)
        if: steps.changes.outputs.docs-only != 'true'
        uses: ./build/src/AntHocNet/.github/actions/setup-emsdk
      - name: Install pinned mkdocs-material and doxygen
        if: steps.changes.outputs.docs-only != 'true'
        run: |
          pip install --require-hashes -r build/src/AntHocNet/requirements/mkdocs-material.txt
          sudo apt-get install -y --no-install-recommends doxygen >/dev/null
          doxygen --version
      - name: Assemble the site (hub, project spaces, AntHocNet game + docs + API)
        if: steps.changes.outputs.docs-only != 'true'
        env:
          AHN_SRC: ${{ github.workspace }}/build/src/AntHocNet
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          tools/build-site.sh _site
      - name: Core coverage badge data (AntHocNet #333, report-only)
        if: steps.changes.outputs.docs-only != 'true'
        # AntHocNet's README badge is a shields.io endpoint reading
        # /AntHocNet/badges/coverage.json from this site, which AntHocNet's own
        # Pages deploy used to publish. Same build, filters and gcovr pin as
        # AntHocNet's core-coverage job, on the pinned core; continue-on-error,
        # so a hiccup costs the badge, never the deploy.
        continue-on-error: true
        working-directory: build/src/AntHocNet
        run: |
          pip install --require-hashes -r requirements/gcovr.txt
          # swarm-core's sources at the release AntHocNet's swarm-core.lock names
          # (its tools/swarm_core.py), as AntHocNet's core-coverage job: from
          # swarm-routing/AntHocNet#1101 its core/ takes swarm-core from the
          # vcpkg port unless SWARM_CORE_DIR is set (swarm-routing/.github#489)
          cmake -S core -B core/build-coverage -DCMAKE_BUILD_TYPE=Debug -DANTHOCNET_COVERAGE=ON \
            -DSWARM_CORE_DIR="$(python3 -I tools/swarm_core.py path)"
          cmake --build core/build-coverage -j
          (cd core/build-coverage && ctest --output-on-failure)
          gcovr --root . core/build-coverage \
            --filter 'core/src/' --filter 'core/include/' --exclude 'core/tests/' \
            --print-summary --json-summary "$RUNNER_TEMP/coverage.json"
          mkdir -p "$GITHUB_WORKSPACE/_site/AntHocNet/badges"
          python3 - "$RUNNER_TEMP/coverage.json" > "$GITHUB_WORKSPACE/_site/AntHocNet/badges/coverage.json" <<'PY'
          import json, sys
          pct = json.load(open(sys.argv[1]))["line_percent"]
          color = next(c for floor, c in (
              (90, "brightgreen"), (80, "green"), (70, "yellowgreen"),
              (60, "yellow"), (50, "orange"), (0, "red")) if pct >= floor)
          print(json.dumps({"schemaVersion": 1, "label": "core coverage",
                            "message": f"{pct:.1f}%", "color": color}))
          PY
          cat "$GITHUB_WORKSPACE/_site/AntHocNet/badges/coverage.json"
      - name: Record which core this build ships (for the live smoke)
        if: steps.changes.outputs.docs-only != 'true'
        id: core
        run: echo "v=$(grep -o 'anthocnet\.js?v=[0-9a-f]*' _site/AntHocNet/js/engine.js | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Native vs WASM decision-trace parity (golden rule 11)
        if: steps.changes.outputs.docs-only != 'true'
        working-directory: build/src/AntHocNet
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          web/test/parity.sh 120 "1 2 7 42"
          node web/test/xray.test.mjs
      - name: AntHocNet's web tests (quest parser, i18n, bench, experiment, levels, labs)
        if: steps.changes.outputs.docs-only != 'true'
        working-directory: build/src/AntHocNet
        run: |
          node web/test/quest.test.mjs
          python3 web/tools/i18n-check.py
          python3 tools/checks/check-site-links.py   # every core class has a Nest chamber (ADR-0001 item 6)
          node web/test/bench.test.mjs "$GITHUB_WORKSPACE/_site/AntHocNet"
          node web/test/experiment.test.mjs "$GITHUB_WORKSPACE/_site/AntHocNet"
          node web/test/levels.mjs "$GITHUB_WORKSPACE/_site/AntHocNet"
          node web/test/labs.mjs "$GITHUB_WORKSPACE/_site/AntHocNet"
      - name: Browser smokes + axe (AntHocNet's game/docs/API, the hub and every project space)
        if: steps.changes.outputs.docs-only != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cp site/anthocnet/test/browser-tools/package.json site/anthocnet/test/browser-tools/package-lock.json "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw"
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright-core install --with-deps chromium
          node "$GITHUB_WORKSPACE/site/anthocnet/test/smoke.mjs" "$GITHUB_WORKSPACE/_site/AntHocNet"
          node "$GITHUB_WORKSPACE/site/anthocnet/test/ants.test.mjs" "$GITHUB_WORKSPACE/_site/AntHocNet"   # the map draws the ants the core logs (#94)
          node "$GITHUB_WORKSPACE/test/hub-smoke.mjs" "$GITHUB_WORKSPACE/_site"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.changes.outputs.docs-only != 'true' && (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.changes.outputs.docs-only != 'true' && (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        with:
          path: _site
          retention-days: 3

  # ruff check (org ruff.toml) and tools/'s self-tests under coverage.py,
  # report-only, not a required check; the coverage goes to Codecov
  # (swarm-routing/.github#635). `ruff format` is not adopted here yet.
  python:
    uses: swarm-routing/.github/.github/workflows/reusable-python-ci.yml@6cca00a3550b6d2a3232bb22d02d5419ff94eefa # main@2026-11-27
    with:
      paths: tools
      ruff-format: false
      tests: tools/test_selftests.py
      source: tools

  # The Python coverage to Codecov (report-only; GitHub OIDC, no stored
  # token). Not in the merge queue: main's push uploads it.
  codecov:
    needs: python
    if: github.event_name != 'merge_group'
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@6cca00a3550b6d2a3232bb22d02d5419ff94eefa # main@2026-11-27
    with:
      artifact: python-coverage
      flags: python

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          # the union of the audit runs 45500331948, 45498902439, 45475452134,
          # 45468109103; the run-actions-N-azure-<region> host changes per run
          # and is also covered by Harden-Runner's own *.actions.githubusercontent.com.
          # How to update it: swarm-routing/.github CONTRIBUTING invariant 5
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-2-azure-eastus.actions.githubusercontent.com:443
            run-actions-3-azure-eastus.actions.githubusercontent.com:443
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # After the deploy, wait until the live engine.js imports the core this build
  # made, then check the game delivers and the docs, API, Workshop and 404 carry
  # AntHocNet's top bar under /AntHocNet/ (AntHocNet #647), and the hub and every
  # project space answer 200. A failure opens (or comments on) one tracking issue.
  live-smoke:
    name: Smoke the live site
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pages must come from the commit this run deployed (#28): a copy of
      # /AntHocNet/ served by another Pages site once passed every check below.
      - name: The live pages carry this build's marker
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          base="${URL:-https://swarm-routing.github.io/}"
          python3 tools/stamp_build.py live "$base" "$GITHUB_SHA" --wait 900
      - name: Live smoke under /AntHocNet/
        env:
          CORE: ${{ needs.build.outputs.core }}
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cp site/anthocnet/test/browser-tools/package.json site/anthocnet/test/browser-tools/package-lock.json "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw"
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright-core install --with-deps chromium
          base="${URL:-https://swarm-routing.github.io/}"
          case "$base" in */) ;; *) base="$base/";; esac
          node "$GITHUB_WORKSPACE/site/anthocnet/test/live-smoke.mjs" "${base}AntHocNet/" "$CORE"
      - name: The hub, the pipeline page and every project space answer 200
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          base="${URL:-https://swarm-routing.github.io/}"
          case "$base" in */) ;; *) base="$base/";; esac
          fail=0
          for p in "" pipeline/ projects/ references/ images/ arena/ $(python3 -c "import json; print(' '.join(d + p['id'] + '/' for p in json.load(open('site/hub/projects.json'))['projects'] for d in ('projects/', 'arena/')))"); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$p")
            echo "$code $base$p"
            [ "$code" = 200 ] || fail=1
          done
          exit "$fail"
      - name: Open or update the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='[learn-site] the live site failed its post-deploy smoke'
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
                  --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          body="The post-deploy smoke failed on the live site after deploying \`$GITHUB_SHA\`: $RUN_URL

          The failing checks are in the job log (site/anthocnet/test/live-smoke.mjs, the hub check). Nothing was rolled back."
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"
          else gh issue create --title "$title" --label bug --label learn-site --body "$body"; fi
